<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp-Humid - Graphs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>

</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="bi bi-thermometer"></i>
                Temp-Humid
            </div>
            <div class="social-media">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About Us</a>
                <a href="index.html#graph">Visuals</a>
                <a href="#footer">Contact Us</a>
                <!-- <a href="graphs.html">Graphs</a> -->
            </div>
        </nav>
        <section id="visualization-section">
            <div id="values">
                <span id="temperature-value">Temperature: 45</span>
                <span id="humidity-value">Humidity: 80</span>
            </div>
            <div class="button-group">
                <button id="visualize-temp-btn">Show Temperature Graph</button>
                <button id="visualize-humidity-btn">Show Humidity Graph</button>
            </div>
            <div id="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </section>
    </header>
    <footer>
        <div class="footer-content" id="footer">
            <p>&copy; 2024 Temp-Humid. All rights reserved.</p>
        </div>
    </footer>
   

    <script src="scripts.js"></script>
</body>
</html>
